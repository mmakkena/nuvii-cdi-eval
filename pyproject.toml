[tool.poetry]
name = "nuvii-eval"
version = "0.1.0"
description = "Evaluation framework for Nuvii CDI Agent V2 pipelines"
authors = ["Nuvii Team"]
readme = "README.md"
packages = [{include = "nuvii_eval", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5"
pydantic-settings = "^2.1"
httpx = "^0.27"
typer = {extras = ["all"], version = "^0.12"}
rich = "^13.7"
python-dotenv = "^1.0"
structlog = "^24.1"
tenacity = "^8.2"
tqdm = "^4.66"

[tool.poetry.group.eval.dependencies]
arize-phoenix = "^4.0"
opentelemetry-api = "^1.22"
opentelemetry-sdk = "^1.22"
ragas = "^0.1"
langchain = "^0.2"
langchain-openai = "^0.1"
datasets = "^2.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
ruff = "^0.2"
mypy = "^1.8"
pre-commit = "^3.6"
respx = "^0.20"  # HTTP mocking for httpx

[tool.poetry.scripts]
nuvii-eval = "nuvii_eval.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for typer)
]

[tool.ruff.lint.isort]
known-first-party = ["nuvii_eval"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "phoenix.*",
    "ragas.*",
    "langchain.*",
    "datasets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/nuvii_eval --cov-report=term-missing"

[tool.coverage.run]
source = ["src/nuvii_eval"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
