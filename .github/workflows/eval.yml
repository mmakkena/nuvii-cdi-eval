name: CDI Evaluation

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to evaluate'
        required: true
        default: 'datasets/icd_tests.json'
      task_type:
        description: 'Task type (icd, hcc, gap, query, em, all)'
        required: false
        default: 'all'
      fail_threshold:
        description: 'Minimum pass rate to succeed (%)'
        required: false
        default: '80'

  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'

env:
  PYTHON_VERSION: "3.11"

jobs:
  evaluate:
    name: Run Evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run evaluation
        id: eval
        env:
          NUVII_API_BASE_URL: ${{ secrets.NUVII_API_BASE_URL }}
          NUVII_API_KEY: ${{ secrets.NUVII_API_KEY }}
        run: |
          poetry run nuvii-eval run eval \
            ${{ github.event.inputs.dataset || 'datasets/icd_tests.json' }} \
            --task ${{ github.event.inputs.task_type || 'all' }} \
            --output results/eval_${{ github.run_id }}.json \
            --format json \
            --verbose

      - name: Generate HTML report
        run: |
          poetry run nuvii-eval report generate \
            results/eval_${{ github.run_id }}.json \
            --output results/report_${{ github.run_id }}.html \
            --format html \
            --title "CDI Evaluation - Run #${{ github.run_id }}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-${{ github.run_id }}
          path: |
            results/eval_${{ github.run_id }}.json
            results/report_${{ github.run_id }}.html

      - name: Check pass rate threshold
        run: |
          PASS_RATE=$(cat results/eval_${{ github.run_id }}.json | jq '.stats.pass_rate')
          THRESHOLD=${{ github.event.inputs.fail_threshold || '80' }}
          echo "Pass rate: ${PASS_RATE}%"
          echo "Threshold: ${THRESHOLD}%"
          if (( $(echo "$PASS_RATE < $THRESHOLD" | bc -l) )); then
            echo "::error::Pass rate ${PASS_RATE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

  compare:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: evaluation-results-${{ github.run_id }}
          path: results/

      - name: Compare with baseline
        id: compare
        run: |
          poetry run nuvii-eval compare ci main \
            --results results/eval_${{ github.run_id }}.json \
            > comparison.md || true

      - name: Generate PR comment
        run: |
          poetry run nuvii-eval report pr \
            results/eval_${{ github.run_id }}.json \
            --output pr_comment.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: pr_comment.md
